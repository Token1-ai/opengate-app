<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"/>
<title>OpenGate Territory</title>
<meta name="theme-color" content="#12140F"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
:root{
  --field:#12140F;        /* тёмная олива — фон приборной панели */
  --field-2:#1B1E16;
  --line:#2E332A;
  --sand:#E8E2D0;         /* песочный — основной текст */
  --sand-dim:#9AA08C;
  --amber:#E0A32E;        /* своё */
  --rust:#B4462F;         /* чужое */
  --slate:#6E7A6B;        /* ничьё */
  --ok:#7FA65C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;overflow:hidden;background:var(--field);
  color:var(--sand);font-family:'Space Mono',ui-monospace,monospace;overflow-wrap:break-word;}
#map{position:absolute;inset:0;background:var(--field);}

/* Карта приглушена: она подложка, а не главное. Так территория читается. */
.leaflet-tile-pane{filter:grayscale(1) brightness(.42) contrast(1.15);}
.leaflet-container{background:var(--field);}
.leaflet-control-attribution{background:rgba(18,20,15,.82)!important;color:var(--sand-dim)!important;font-size:9px!important;}
.leaflet-control-attribution a{color:var(--sand-dim)!important;}

/* ── Верхняя строка состояния ── */
#hud{position:absolute;top:0;left:0;right:0;z-index:600;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;
  background:linear-gradient(180deg,rgba(18,20,15,.94),rgba(18,20,15,0));pointer-events:none;}
#hud-row{display:flex;align-items:center;gap:10px;}
#brand{font-family:'Oswald',sans-serif;font-weight:700;font-size:17px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--sand);}
#brand em{font-style:normal;color:var(--amber);}
#who{margin-left:auto;font-size:10.5px;color:var(--sand-dim);pointer-events:auto;
  border:1px solid var(--line);border-radius:100px;padding:5px 10px;background:rgba(27,30,22,.9);}
#stats{display:flex;gap:14px;margin-top:8px;font-size:10px;color:var(--sand-dim);letter-spacing:.05em;}
#stats b{color:var(--sand);font-size:13px;font-weight:700;display:block;font-family:'Oswald',sans-serif;}

/* ── Прицел: главный элемент ── */
#retic{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:500;
  pointer-events:none;width:132px;height:132px;}
#retic svg{width:100%;height:100%;overflow:visible;}
#retic .ring{fill:none;stroke:var(--rust);stroke-width:1.5;opacity:.85;
  transition:stroke .5s ease, r .8s cubic-bezier(.2,.8,.2,1);}
#retic .tick{stroke:var(--rust);stroke-width:2;transition:stroke .5s ease;}
#retic.lock .ring,#retic.lock .tick{stroke:var(--amber);}
#retic .spin{transform-origin:50% 50%;animation:spin 9s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#retic.lock .spin{animation-duration:3.5s;}
@media (prefers-reduced-motion:reduce){#retic .spin{animation:none;}}
#acc{position:absolute;left:50%;top:calc(50% + 78px);transform:translateX(-50%);z-index:500;
  font-size:10px;letter-spacing:.1em;color:var(--rust);pointer-events:none;white-space:normal;text-align:center;}
#retic.lock ~ #acc{color:var(--amber);}

/* ── Нижняя панель ── */
#dock{position:absolute;left:0;right:0;bottom:0;z-index:600;
  padding:14px 12px calc(env(safe-area-inset-bottom) + 14px);
  background:linear-gradient(0deg,rgba(18,20,15,.96) 55%,rgba(18,20,15,0));}
#msg{font-size:11.5px;line-height:1.55;color:var(--sand-dim);margin-bottom:10px;min-height:32px;}
#msg.warn{color:var(--rust);}
#msg.good{color:var(--ok);}
.btn{width:100%;border:none;border-radius:4px;padding:16px;font-family:'Oswald',sans-serif;
  font-size:16px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;cursor:pointer;}
#plant{background:var(--amber);color:#12140F;}
#plant:disabled{background:var(--field-2);color:var(--sand-dim);border:1px solid var(--line);cursor:not-allowed;}
.row{display:flex;gap:8px;margin-top:8px;}
.btn-ghost{flex:1;background:var(--field-2);border:1px solid var(--line);color:var(--sand);
  border-radius:4px;padding:11px;font-family:'Oswald',sans-serif;font-size:12px;
  letter-spacing:.09em;text-transform:uppercase;cursor:pointer;}

/* ── Подписи территорий ── */
.terr-label{font-family:'Oswald',sans-serif;font-size:12px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;white-space:nowrap;text-shadow:0 1px 4px #000,0 0 12px #000;}
.terr-mine{color:var(--amber);}
.terr-them{color:var(--rust);}

/* ── Окно ── */
#veil{position:fixed;inset:0;z-index:900;background:rgba(9,10,7,.9);display:none;
  align-items:center;justify-content:center;padding:16px;}
#veil.on{display:flex;}
#sheet{background:var(--field-2);border:1px solid var(--line);border-radius:6px;
  padding:22px;width:100%;max-width:380px;max-height:88vh;overflow-y:auto;}
#sheet h2{font-family:'Oswald',sans-serif;font-size:19px;letter-spacing:.08em;text-transform:uppercase;
  margin:0 0 12px;color:var(--sand);}
#sheet p{font-size:12.5px;line-height:1.7;color:var(--sand-dim);margin:0 0 14px;}
#sheet input{width:100%;background:var(--field);border:1px solid var(--line);color:var(--sand);
  border-radius:4px;padding:13px;font-family:'Space Mono',monospace;font-size:15px;margin-bottom:12px;}
#shot{width:100%;border-radius:4px;border:1px solid var(--line);margin-bottom:12px;display:none;}
</style>
</head>
<body>

<div id="map"></div>

<div id="retic">
  <svg viewBox="0 0 132 132">
    <g class="spin">
      <circle class="ring" cx="66" cy="66" r="52" stroke-dasharray="6 12"/>
    </g>
    <circle class="ring" id="acc-ring" cx="66" cy="66" r="30"/>
    <line class="tick" x1="66" y1="44" x2="66" y2="56"/>
    <line class="tick" x1="66" y1="76" x2="66" y2="88"/>
    <line class="tick" x1="44" y1="66" x2="56" y2="66"/>
    <line class="tick" x1="76" y1="66" x2="88" y2="66"/>
  </svg>
</div>
<div id="acc">looking for satellites</div>

<div id="hud">
  <div id="hud-row">
    <div id="brand">Open<em>Gate</em> Territory</div>
    <button id="who" onclick="connect()">connect</button>
  </div>
  <div id="stats">
    <div>YOURS<b id="s-mine">—</b></div>
    <div>NEARBY<b id="s-near">—</b></div>
    <div>TODAY<b id="s-left">—</b></div>
  </div>
</div>

<div id="dock">
  <div id="msg">Stand where you want your bunker. The ring locks when the signal is good enough.</div>
  <button class="btn" id="plant" onclick="plant()" disabled>Plant bunker</button>
  <div class="row">
    <button class="btn-ghost" onclick="recenter()">Center on me</button>
    <button class="btn-ghost" onclick="askName()">Name land</button>
  </div>
</div>

<div id="veil" onclick="if(event.target===this)closeSheet()">
  <div id="sheet">
    <h2 id="sheet-t">—</h2>
    <p id="sheet-p">—</p>
    <img id="shot" alt=""/>
    <input id="sheet-in" style="display:none" maxlength="24" placeholder="Northside"/>
    <button class="btn" id="sheet-ok" onclick="sheetOk()">OK</button>
    <div class="row"><button class="btn-ghost" onclick="closeSheet()">Cancel</button></div>
  </div>
</div>

<input type="file" id="cam" accept="image/*" capture="environment" style="display:none"/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ═══════════════════════════════════════════════════════════════════
//  OpenGate Territory — шаг 1: карта, земляные бункеры, территория.
//  Боя и денег здесь нет. Задача — понять, ходят ли люди вообще.
//
//  Все правила (расстояние, лимиты, точность) проверяет функция базы
//  place_bunker. В браузере они только показываются: страницу можно
//  открыть в консоли и вызвать что угодно, базу обойти нельзя.
// ═══════════════════════════════════════════════════════════════════

const SB_URL = 'https://hgzthbidfdqomuotdocb.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhnenRoYmlkZmRxb211b3Rkb2NiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMTI2NjEsImV4cCI6MjA5NjU4ODY2MX0.otgk-jq2k0COrIE3cUEnRBPYKGnzAHRi3LEIQhE7khA';
const sb = window.supabase.createClient(SB_URL, SB_KEY);

let map, meDot, meHalo;
let addr = null, here = null, acc = null;
let cfg = { max_accuracy_m:40, radius_earth_m:100, min_distance_m:100, earth_per_day:1 };
let layers = new Map();      // id -> слой
let labels = new Map();      // owner -> подпись
let bunkers = [];
let pendingPhoto = null;
let sheetMode = null;

// ── Карта ────────────────────────────────────────────────────────
function initMap(){
  map = L.map('map', { zoomControl:false, attributionControl:true })
         .setView([50.4501, 30.5234], 16);   // Киев, пока не найдёт человека
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap'
  }).addTo(map);
  map.on('moveend', drawLabels);
}

// ── Где я ────────────────────────────────────────────────────────
let followed = false;
function watchMe(){
  if(!navigator.geolocation){ say('This device has no location service.', 'warn'); return; }
  navigator.geolocation.watchPosition(p => {
    here = [p.coords.latitude, p.coords.longitude];
    acc  = p.coords.accuracy;
    if(!followed){ map.setView(here, 17); followed = true; loadNear(); }
    paintMe();
    paintReticle();
  }, err => {
    say(err.code === 1
      ? 'Location is blocked. Allow it in your browser settings, then reload.'
      : 'No signal yet. Step outside — walls and roofs block satellites.', 'warn');
  }, { enableHighAccuracy:true, maximumAge:2000, timeout:20000 });
}

function paintMe(){
  if(!here) return;
  if(!meDot){
    meHalo = L.circle(here, { radius:acc||30, color:'#E0A32E', weight:1, opacity:.35,
                              fillColor:'#E0A32E', fillOpacity:.06 }).addTo(map);
    meDot  = L.circleMarker(here, { radius:6, color:'#12140F', weight:2,
                                    fillColor:'#E0A32E', fillOpacity:1 }).addTo(map);
  } else {
    meDot.setLatLng(here); meHalo.setLatLng(here); meHalo.setRadius(acc||30);
  }
}

// Прицел показывает настоящую точность, а не украшение:
// кольцо сжимается по мере того, как сигнал становится лучше.
function paintReticle(){
  const r = document.getElementById('retic');
  const ring = document.getElementById('acc-ring');
  const txt = document.getElementById('acc');
  const btn = document.getElementById('plant');
  if(acc == null){ txt.textContent = 'looking for satellites'; return; }
  const good = acc <= cfg.max_accuracy_m;
  // 8 м → маленькое кольцо, 120 м → большое
  const rad = Math.max(14, Math.min(52, 14 + (acc - 8) * 0.4));
  ring.setAttribute('r', rad.toFixed(0));
  r.classList.toggle('lock', good);
  txt.textContent = good
    ? '± ' + Math.round(acc) + ' m · locked'
    : '± ' + Math.round(acc) + ' m · need ' + cfg.max_accuracy_m + ' m';
  btn.disabled = !(good && addr);
  if(!addr) document.getElementById('plant').textContent = 'Connect wallet first';
  else document.getElementById('plant').textContent = 'Plant bunker';
}

function recenter(){ if(here) map.setView(here, 17); }

// ── Кошелёк ──────────────────────────────────────────────────────
async function connect(){
  if(!window.ethereum){
    sheet('No wallet found',
      'Open this page inside your wallet app browser — MetaMask, Trust Wallet or another. That is where your address lives.');
    return;
  }
  try{
    const a = await window.ethereum.request({ method:'eth_requestAccounts' });
    addr = (a[0]||'').toLowerCase();
    document.getElementById('who').textContent = addr.slice(0,6)+'…'+addr.slice(-4);
    say('Ready. Stand on the spot and plant.');
    paintReticle(); refreshStats();
  }catch(e){ say('Wallet connection was refused.', 'warn'); }
}

// ── Загрузка карты ───────────────────────────────────────────────
async function loadCfg(){
  const { data } = await sb.from('territory_config').select('key,value');
  (data||[]).forEach(r => cfg[r.key] = Number(r.value));
}

async function loadNear(){
  if(!here) return;
  const d = 0.03;   // примерно 3 км во все стороны
  const { data, error } = await sb.from('territory_bunkers')
    .select('id,owner,lat,lng,kind,built_at')
    .eq('alive', true)
    .gte('lat', here[0]-d).lte('lat', here[0]+d)
    .gte('lng', here[1]-d).lte('lng', here[1]+d)
    .limit(2000);
  if(error){ say('Could not load the map. Check your connection.', 'warn'); return; }
  bunkers = data || [];
  drawAll();
  const { data:nm } = await sb.from('territory_names').select('owner,label');
  window._names = {}; (nm||[]).forEach(r => window._names[r.owner] = r.label);
  drawLabels();
  refreshStats();
}

function drawAll(){
  layers.forEach(l => map.removeLayer(l));
  layers.clear();
  bunkers.forEach(drawOne);
}

function drawOne(b){
  const mine = addr && b.owner === addr;
  const col = mine ? '#E0A32E' : '#B4462F';
  const g = L.layerGroup();
  L.circle([b.lat,b.lng], {
    radius: cfg.radius_earth_m, color: col, weight: mine ? 2 : 1,
    opacity: mine ? .9 : .55, fillColor: col, fillOpacity: mine ? .14 : .07,
    dashArray: mine ? null : '5 6'
  }).addTo(g);
  L.circleMarker([b.lat,b.lng], {
    radius:5, color:'#12140F', weight:2, fillColor:col, fillOpacity:1
  }).addTo(g);
  g.addTo(map);
  layers.set(b.id, g);
}

// Подпись ставится в середине своих бункеров — там, где «центр земли»
function drawLabels(){
  labels.forEach(l => map.removeLayer(l));
  labels.clear();
  const names = window._names || {};
  const byOwner = {};
  bunkers.forEach(b => { (byOwner[b.owner] = byOwner[b.owner] || []).push(b); });
  Object.keys(byOwner).forEach(owner => {
    const label = names[owner];
    const list = byOwner[owner];
    if(!label || list.length < 3) return;
    const lat = list.reduce((s,b)=>s+b.lat,0)/list.length;
    const lng = list.reduce((s,b)=>s+b.lng,0)/list.length;
    const mine = addr && owner === addr;
    const m = L.marker([lat,lng], { interactive:false, icon: L.divIcon({
      className:'', html:'<div class="terr-label '+(mine?'terr-mine':'terr-them')+'">'+esc(label)+'</div>',
      iconSize:[0,0]
    })}).addTo(map);
    labels.set(owner, m);
  });
}

function refreshStats(){
  const mine = addr ? bunkers.filter(b => b.owner === addr) : [];
  const today = mine.filter(b => new Date(b.built_at).toDateString() === new Date().toDateString());
  document.getElementById('s-mine').textContent = addr ? mine.length : '—';
  document.getElementById('s-near').textContent = bunkers.length;
  document.getElementById('s-left').textContent = addr
    ? Math.max(0, cfg.earth_per_day - today.length) : '—';
}

// ── Постройка ────────────────────────────────────────────────────
function plant(){
  if(!addr){ connect(); return; }
  if(!here || acc > cfg.max_accuracy_m){ say('Signal is too weak right now.', 'warn'); return; }
  document.getElementById('cam').click();
}

document.getElementById('cam').addEventListener('change', function(e){
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if(!f) return;
  const fr = new FileReader();
  fr.onload = () => stampPhoto(fr.result);
  fr.readAsDataURL(f);
});

// На снимок наносим координаты и время. Для шага 1 это запись о том,
// что человек тут был, а не доказательство: настоящая проверка
// (подмена координат, датчики движения) появится в приложении.
function stampPhoto(dataUrl){
  const img = new Image();
  img.onload = function(){
    const side = 900;
    const c = document.createElement('canvas');
    const scale = side / Math.max(img.width, img.height);
    c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
    const x = c.getContext('2d');
    x.drawImage(img, 0, 0, c.width, c.height);
    const pad = 10, h = 54;
    x.fillStyle = 'rgba(18,20,15,.82)';
    x.fillRect(0, c.height-h, c.width, h);
    x.fillStyle = '#E8E2D0';
    x.font = '13px monospace';
    x.fillText(here[0].toFixed(5)+', '+here[1].toFixed(5)+'  ±'+Math.round(acc)+'m', pad, c.height-32);
    x.fillText(new Date().toISOString().slice(0,19).replace('T',' ')+'  '+addr.slice(0,10), pad, c.height-12);
    pendingPhoto = c.toDataURL('image/jpeg', 0.6);
    confirmPlant();
  };
  img.src = dataUrl;
}

function confirmPlant(){
  sheetMode = 'plant';
  document.getElementById('shot').src = pendingPhoto;
  document.getElementById('shot').style.display = 'block';
  document.getElementById('sheet-in').style.display = 'none';
  sheet('Plant here?',
    'This spot becomes yours with a ' + cfg.radius_earth_m + ' m ring around it. '
    + 'Earth bunkers are free — one a day.');
  document.getElementById('sheet-ok').textContent = 'Plant it';
}

async function doPlant(){
  closeSheet();
  say('Planting…');
  const { data, error } = await sb.rpc('place_bunker', {
    p_owner: addr, p_lat: here[0], p_lng: here[1],
    p_accuracy: acc, p_photo: pendingPhoto
  });
  pendingPhoto = null;
  if(error){ say('Could not reach the server. Try again.', 'warn'); return; }
  if(!data || !data.ok){
    const e = data && data.error;
    if(e === 'too_close')    say('Another bunker is ' + data.got + ' m away. You need ' + data.need + ' m of clear ground.', 'warn');
    else if(e === 'daily_limit') say('You have used your free bunker for today. Come back tomorrow.', 'warn');
    else if(e === 'max_alive')   say('You hold the maximum of ' + data.limit + ' bunkers.', 'warn');
    else if(e === 'weak_gps')    say('Signal dropped to ±' + data.got + ' m. Step into the open.', 'warn');
    else say('Could not plant here.', 'warn');
    return;
  }
  say('Planted. This ground is yours.', 'good');
  await loadNear();
}

// ── Название земли ───────────────────────────────────────────────
function askName(){
  if(!addr){ connect(); return; }
  const mine = bunkers.filter(b => b.owner === addr).length;
  if(mine < 3){
    sheet('Not enough ground', 'Name your land once you hold three bunkers. You have ' + mine + '.');
    document.getElementById('shot').style.display = 'none';
    document.getElementById('sheet-in').style.display = 'none';
    document.getElementById('sheet-ok').textContent = 'Got it';
    sheetMode = 'info';
    return;
  }
  sheetMode = 'name';
  document.getElementById('shot').style.display = 'none';
  document.getElementById('sheet-in').style.display = 'block';
  document.getElementById('sheet-in').value = (window._names||{})[addr] || '';
  sheet('Name your land', 'Everyone on the map will see it. Up to 24 characters.');
  document.getElementById('sheet-ok').textContent = 'Save name';
}

async function doName(){
  const label = document.getElementById('sheet-in').value.trim();
  closeSheet();
  const { data, error } = await sb.rpc('name_territory', { p_owner: addr, p_label: label });
  if(error || !data || !data.ok){ say('That name was not accepted.', 'warn'); return; }
  say('Named.', 'good');
  await loadNear();
}

// ── Мелочи ───────────────────────────────────────────────────────
function say(t, cls){
  const m = document.getElementById('msg');
  m.textContent = t; m.className = cls || '';
}
function sheet(title, text){
  document.getElementById('sheet-t').textContent = title;
  document.getElementById('sheet-p').textContent = text;
  document.getElementById('veil').classList.add('on');
}
function closeSheet(){ document.getElementById('veil').classList.remove('on'); }
function sheetOk(){
  if(sheetMode === 'plant') doPlant();
  else if(sheetMode === 'name') doName();
  else closeSheet();
}
function esc(s){ return String(s).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }

// ── Живое обновление: чужие бункеры появляются сами ──────────────
function live(){
  sb.channel('territory')
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'territory_bunkers' }, p => {
      const b = p.new;
      if(!here) return;
      if(Math.abs(b.lat-here[0]) > 0.03 || Math.abs(b.lng-here[1]) > 0.03) return;
      bunkers.push(b); drawOne(b); refreshStats();
      if(addr && b.owner !== addr) say('Someone just planted nearby.', 'warn');
    })
    .subscribe();
}

(async function start(){
  initMap();
  await loadCfg();
  watchMe();
  live();
  if(window.ethereum && window.ethereum.selectedAddress){ connect(); }
})();
</script>
</body>
</html>
